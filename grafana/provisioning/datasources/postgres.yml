apiVersion: 1

datasources:
  - name: MouseTracking PostgreSQL
    uid: postgres_mouse_tracking
    type: postgres
    access: proxy
    url: postgres:5432
    database: mousetracking
    user: postgres
    secureJsonData:
      password: postgres
    jsonData:
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
    isDefault: true
    editable: true
